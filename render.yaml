services:
  - type: web
    name: ragify-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        generateValue: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: CHUNK_SIZE
        value: "800"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: TOP_K_CANDIDATES
        value: "15"
      - key: TOP_K
        value: "5"
      - key: SEMANTIC_WEIGHT
        value: "0.7"
      - key: BM25_WEIGHT
        value: "0.3"
      - key: RERANKING_ENABLED
        value: "True"
      - key: CONFIDENCE_THRESHOLD
        value: "0.35"
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /tmp/ragify/uploads
      - key: VECTOR_STORE_DIR
        value: /tmp/ragify/vectorstore
      - key: DATABASE_URL
        value: sqlite:////tmp/ragify/ragify.db
      - key: DATA_DIR
        value: /tmp/ragify
      - key: EVALUATION_DIR
        value: /tmp/ragify/evaluation
